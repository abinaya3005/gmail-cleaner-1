<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gmail Cleaner</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        input[type="text"] { padding: 5px; width: 300px; }
        select, button { padding: 5px; }
        .error { color: red; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Gmail Cleaner</h1>
    
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <label>Select category:</label>
        <select name="category" onchange="toggleCustom(this.value)">
            <option value="flipkart">Flipkart</option>
            <option value="amazon">Amazon</option>
            <option value="gpay">GPay</option>
            <option value="unread">Unread</option>
            <option value="custom">Custom</option>
        </select>
        <br><br>
        <input type="text" name="custom_query" id="custom_query" placeholder="Enter custom search query" style="display:none;">
        <br><br>
        <button type="submit">Delete Emails</button>
    </form>

    <script>
        function toggleCustom(value){
            document.getElementById('custom_query').style.display = (value === 'custom') ? 'inline-block' : 'none';
        }
    </script>
</body>
</html>
